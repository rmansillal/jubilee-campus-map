<style>
/* Layout: wayfinding-sign sidebar beside a full-height vector map; stacks map-over-list on phones */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#14202e; --muted:#5b6878; --line:#d9dee5;
  --accent:#005597; --accent-fg:#ffffff;
  --ground:#e3ecd9; --ctx:#d3d8de; --ctx-line:#c2c8cf; --mapbg:#eef0f2;
  --acad:#e8711c; --serv:#4a5a6c; --unip:#0b7a3e; --catered:#8b5fbf; --selfcat:#0a7f9c;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-sign:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#181e26; --fg:#e7ecf2; --muted:#94a0ae; --line:#2a333e;
  --accent:#4ea3e6; --accent-fg:#0b1520;
  --ground:#1d2a22; --ctx:#262d36; --ctx-line:#323b46; --mapbg:#151a20;
  --acad:#f08a3c; --serv:#8496ab; --unip:#2fae66; --catered:#a985d6; --selfcat:#2fb0cf;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#181e26; --fg:#e7ecf2; --muted:#94a0ae; --line:#2a333e;
  --accent:#4ea3e6; --accent-fg:#0b1520;
  --ground:#1d2a22; --ctx:#262d36; --ctx-line:#323b46; --mapbg:#151a20;
  --acad:#f08a3c; --serv:#8496ab; --unip:#2fae66; --catered:#a985d6; --selfcat:#2fb0cf;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.head{padding-block:18px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--font-sign);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
h1 small{display:block;font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0;margin-top:6px}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px 11px 38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip:focus-visible,.sort button:focus-visible,li button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.sort{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sort button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:4px 10px;cursor:pointer}
.sort button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
ul{list-style:none;margin:0;padding:6px 0;overflow-y:auto;flex:1;min-height:0}
li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));cursor:pointer}
li button:hover,li button.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.num{font-family:var(--font-sign);font-weight:700;font-size:17px;width:34px;height:30px;border-radius:5px;display:grid;place-items:center;color:#fff;font-variant-numeric:tabular-nums}
.nm{font-weight:700;font-size:14.5px;line-height:1.25}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.empty{padding:20px 16px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-top:1px solid var(--line);line-height:1.45}
.foot a,.pop a{color:var(--accent)}
#map{background:var(--mapbg);min-width:0}
.leaflet-container{font-family:var(--font-body);background:var(--mapbg)}
.pin{font-family:var(--font-sign);font-weight:700;font-size:13px;color:#fff;border-radius:4px;display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--panel);font-variant-numeric:tabular-nums;cursor:pointer}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.leaflet-popup-content{margin:14px 16px;min-width:210px}
.pop .t{font-weight:700;font-size:15px;line-height:1.3;margin-bottom:4px}
.pop .m{color:var(--muted);font-size:13px;margin-bottom:10px}
.pop .acts{display:flex;gap:8px;flex-wrap:wrap}
.pop .acts a,.pop .acts button{font:inherit;font-size:13px;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-decoration:none;cursor:pointer}
.pop .acts a.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.leaflet-bar a{background:var(--panel);color:var(--fg);border-bottom-color:var(--line)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--accent)}
.compass{font-family:var(--font-sign);font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:52vh 1fr}
  #map{grid-row:1}
  aside{grid-row:2;border-right:0;border-top:1px solid var(--line)}
  .head{padding-block:12px 10px}
  h1{font-size:22px}
  aside{overflow-y:auto}
  ul{overflow:visible;flex:none}
  .foot{font-size:11.5px}
  li button{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .head,.foot{padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

6],[-1.1929,52.95354],[-1.19274,52.95357],[-1.19276,52.95363],[-1.19296,52.95359]],[[-1.19317,52.95409],[-1.1933,52.95404],[-1.19332,52.95404],[-1.19326,52.95398],[-1.19312,52.95403],[-1.19317,52.95409]],[[-1.19323,52.95415],[-1.19337,52.9541],[-1.19338,52.95409],[-1.19332,52.95404],[-1.19317,52.95409],[-1.19323,52.95415]]],"ground":[[-1.192,52.95436],[-1.19229,52.9546],[-1.19229,52.9547],[-1.19221,52.95481],[-1.19209,52.95488],[-1.19133,52.95509],[-1.19058,52.95511],[-1.18904,52.95483],[-1.18535,52.95394],[-1.18373,52.95369],[-1.18279,52.9531],[-1.18164,52.95201],[-1.18155,52.95185],[-1.18155,52.95097],[-1.18325,52.94795],[-1.18399,52.94734],[-1.18519,52.94686],[-1.18563,52.94688],[-1.18581,52.94701],[-1.18763,52.94964],[-1.18753,52.95215],[-1.18885,52.9534],[-1.192,52.95436]]};
const CATS={acad:"Academic department",serv:"Teaching, research and services",unip:"Innovation Park (UNIP)",catered:"Catered hall",selfcat:"Self-catered hall"};
const CHIPS=[["acad","Academic"],["serv","Services"],["unip","Innovation Park"],["halls","Halls"]];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
const groupOf=c=>(c==="catered"||c==="selfcat")?"halls":c;
const B=DATA.b.map((b,i)=>({...b,id:i,key:'b-'+(b.n+'-'+b.name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'')}));
// share polygon for entries without geometry
B.forEach(b=>{if(!b.geom){const o=B.find(x=>x.osm===b.osm&&x.geom);b.geom=o.geom;b.gtype=o.gtype;b.shared=o.id}});

const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:15,maxZoom:20,zoomSnap:.25});
map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
map.attributionControl.addAttribution('© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors');
const toLL=r=>r.map(([x,y])=>[y,x]);
const ground=L.polygon(toLL(DATA.ground),{interactive:false}).addTo(map);
const ctx=L.layerGroup(DATA.ctx.map(r=>L.polygon(toLL(r),{interactive:false,weight:.6}))).addTo(map);
const shapes={};
B.forEach(b=>{
  if(b.shared!==undefined)return;
  const ll=b.gtype==="Polygon"?b.geom.map(toLL):b.geom.map(p=>p.map(toLL));
  const s=L.polygon(ll,{weight:1.5}).addTo(map);
  s.on('click',()=>select(b.id,true));
  shapes[b.id]=s;
});
const shapeOf=b=>shapes[b.shared??b.id];
const pins={};
B.forEach(b=>{
  if(b.shared!==undefined)return; // one pin per outline
  const label=B.filter(x=>x.osm===b.osm).map(x=>x.n).filter((v,i,a)=>a.indexOf(v)===i).join('/');
  const w=Math.max(22,label.length*8+8);
  pins[b.id]=L.marker([b.lat,b.lng],{icon:L.divIcon({className:'',html:`<div class="pin" data-cat="${b.cat}" style="width:${w}px;height:20px">${label}</div>`,iconSize:[w,20],iconAnchor:[w/2,10]}),keyboard:false,title:b.name}).addTo(map).on('click',()=>select(b.id,true));
});
map.fitBounds(L.polygon(toLL(DATA.ground)).getBounds(),{padding:[20,20]});
L.Control.Compass=L.Control.extend({onAdd(){const d=L.DomUtil.create('div','compass');d.textContent='▲ N';return d}});
new L.Control.Compass({position:'topright'}).addTo(map);
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);

let active=new Set(CHIPS.map(c=>c[0])),sortMode='az',sel=null;
function paint(){
  ground.setStyle({color:css('ground'),fillColor:css('ground'),fillOpacity:1,weight:0});
  ctx.eachLayer(l=>l.setStyle({color:css('ctx-line'),fillColor:css('ctx'),fillOpacity:1}));
  B.forEach(b=>{const s=shapes[b.id];if(!s)return;const on=active.has(groupOf(b.cat));const isSel=sel!==null&&(sel===b.id||B[sel].shared===b.id);
    s.setStyle({color:isSel?css('fg'):css(b.cat),fillColor:css(b.cat),fillOpacity:on?(isSel?.85:.55):.08,opacity:on?1:.25,weight:isSel?3:1.5});
    if(isSel)s.bringToFront();});
  document.querySelectorAll('.pin').forEach(p=>{p.style.background=css(p.dataset.cat)});
  Object.entries(pins).forEach(([id,m])=>{const b=B[id];const on=B.some(x=>x.osm===b.osm&&active.has(groupOf(x.cat)));m.setOpacity(on?1:.15)});
  document.querySelectorAll('.num').forEach(n=>n.style.background=css(n.dataset.cat));
  document.querySelectorAll('.chip i').forEach(i=>i.style.background=css(i.dataset.cat));
}
const chips=document.getElementById('chips');
chips.innerHTML=CHIPS.map(([k,l])=>`<button class="chip" id="chip-${k}" aria-pressed="true" data-k="${k}"><i data-cat="${k==='halls'?'catered':k}"></i>${l}</button>`).join('');
chips.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.k;
  if(active.has(k)&&active.size===CHIPS.length){active=new Set([k])}else if(active.has(k)){active.delete(k);if(!active.size)active=new Set(CHIPS.map(c=>c[0]))}else active.add(k);
  chips.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',active.has(x.dataset.k)));render();paint()});

const q=document.getElementById('q'),list=document.getElementById('list');
const norm=s=>s.toLowerCase().replace(/^the\s+/,'');
function matches(b,t){if(!t)return true;t=t.trim().toLowerCase();
  if(/^[a-h][1-5]$/.test(t))return b.grid.toLowerCase()===t;
  if(/^\d+$/.test(t)||/^[abc]$/.test(t))return b.n.toLowerCase()===t;
  return (b.name+' '+CATS[b.cat]).toLowerCase().includes(t)}
function render(){
  const t=q.value;let r=B.filter(b=>active.has(groupOf(b.cat))&&matches(b,t));
  r.sort(sortMode==='az'?(a,b)=>norm(a.name).localeCompare(norm(b.name)):(a,b)=>{const na=isNaN(a.n)?1000+a.n.charCodeAt(0):+a.n,nb=isNaN(b.n)?1000+b.n.charCodeAt(0):+b.n;return na-nb||a.name.localeCompare(b.name)});
  document.getElementById('count').textContent=`${r.length} building${r.length===1?'':'s'}`;
  list.innerHTML=r.length?r.map(b=>`<li><button data-id="${b.id}" class="${sel===b.id?'on':''}"><span class="num" data-cat="${b.cat}">${b.n}</span><span><div class="nm">${b.name}</div><div class="meta">${CATS[b.cat]} · ${b.grid}</div></span></button></li>`).join(''):`<li class="empty">No building matches “${t.replace(/</g,'&lt;')}”. Try a name, a number like 31, or a grid square like F3.</li>`;
  paint();
}
list.addEventListener('click',e=>{const x=e.target.closest('button[data-id]');if(x)select(+x.dataset.id,false)});
q.addEventListener('input',()=>{render();const r=[...list.querySelectorAll('button[data-id]')];if(r.length===1)select(+r[0].dataset.id,false,true)});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=list.querySelector('button[data-id]');if(f)select(+f.dataset.id,false)}});
document.getElementById('sAZ').onclick=()=>{sortMode='az';sAZ.setAttribute('aria-pressed',true);sNum.setAttribute('aria-pressed',false);render()};
document.getElementById('sNum').onclick=()=>{sortMode='num';sNum.setAttribute('aria-pressed',true);sAZ.setAttribute('aria-pressed',false);render()};

const popup=L.popup({maxWidth:280,autoPanPadding:[30,30]});
function select(id,fromMap,quiet){
  sel=id;const b=B[id];
  const dir=`https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}&travelmode=walking`;
  const html=`<div class="pop"><div class="t">${b.name}</div><div class="m">No. ${b.n} · Grid ${b.grid} · ${CATS[b.cat]}</div><div class="acts"><a class="primary" href="${dir}" target="_blank" rel="noopener">Walking directions</a><button type="button" id="cp">Copy link</button></div></div>`;
  const s=shapeOf(b);
  map.flyToBounds(s.getBounds(),{maxZoom:18.5,padding:[60,60],duration:.6});
  popup.setLatLng([b.lat,b.lng]).setContent(html).openOn(map);
  const cp=document.getElementById('cp');
  cp.onclick=()=>{const u=location.href.split('#')[0]+'#'+b.key;
    const done=()=>{cp.textContent='Link copied'};
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(done).catch(()=>{cp.outerHTML=`<input value="${u}" readonly style="font:inherit;font-size:12px;width:100%;padding:5px" onfocus="this.select()">`});};
  try{history.replaceState(null,'','#'+b.key)}catch(e){}
  list.querySelectorAll('button.on').forEach(x=>x.classList.remove('on'));
  const li=list.querySelector(`button[data-id="${id}"]`);if(li){li.classList.add('on');if(fromMap)li.scrollIntoView({block:'nearest'})}
  paint();
}
map.on('popupclose',()=>{sel=null;list.querySelectorAll('button.on').forEach(x=>x.classList.remove('on'));paint()});
render();
const h=location.hash.slice(1);const hb=B.find(b=>b.key===h);if(hb)select(hb.id,false);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint);
new MutationObserver(paint).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
